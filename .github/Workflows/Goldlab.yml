name: goldlab

on:
  schedule:
    - cron: '7 * * * 1-5'   # every hour at :07 UTC, Mon-Fri
  workflow_dispatch:         # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: goldlab
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run GoldLab (paper only)
        env:
          TWELVE_KEY: ${{ secrets.TWELVE_KEY }}
        run: python goldlab.py
      - name: Save ledger
        run: |
          git config user.name "goldlab-bot"
          git config user.email "goldlab-bot@users.noreply.github.com"
          git add ledger.json last_run.txt
          git diff --staged --quiet || git commit -m "update ledger"
          git push
